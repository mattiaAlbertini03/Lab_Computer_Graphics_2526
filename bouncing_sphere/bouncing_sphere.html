<!doctype html>
<html>
	<head>
		<style>
#my_Canvas { border: thin inset #aaaaaa; }
		</style>
	</head>
	<body>
		<h1>WebGL: OBJ Bouncing Sphere</h1>
		<p>
			<button id="Button1">Increase FOV</button>
			<button id="Button2">Decrease FOV</button>
			<button id="Button3">Increase D</button>
			<button id="Button4">Decrease D</button>
		</p>
		<p>
			<button id="Button5">Increase theta</button>
			<button id="Button6">Decrease theta</button>
			<button id="Button7">Increase phi</button>
			<button id="Button8">Decrease phi</button>
		</p>

		<canvas width="500" height="500" id="my_Canvas"></canvas>
		<script id="vertex-shader" type="x-shader/x-vertex">
attribute vec3 a_position;
uniform mat4 Pmatrix;
uniform mat4 Vmatrix;
uniform mat4 Mmatrix;
void main(void) { 
  gl_Position = Pmatrix*Vmatrix*Mmatrix*vec4(a_position, 1.);
}
		</script>
		<script id="fragment-shader" type="x-shader/x-fragment">
precision mediump float;
void main(void) {
  gl_FragColor = vec4(0., 0., 1., 1.);
}
		</script>
		<script type="text/javascript" src="webgl-utils.js"></script>
		<script type="text/javascript" src="m4.js"></script>
		<script type="text/javascript" src="bouncing_sphere.js"></script>
	</body>
</html>
