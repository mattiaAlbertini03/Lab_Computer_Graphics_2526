<!doctype html>
<html>
  <head>
      <style>
        #mycanvas { border: thin inset #aaaaaa; }
    </style>
</head>
<body>
<canvas width="500" height="500" id="mycanvas"></canvas>
<script id="vertex-shader" type="x-shader/x-vertex">
attribute vec3 a_position;
uniform mat4 Pmatrix; 
uniform mat4 Vmatrix;
uniform mat4 Mmatrix;
attribute vec3 a_color; //the color of the point 
varying vec3 vColor;
void main(void) { //pre-built function
  gl_Position = Pmatrix*Vmatrix*Mmatrix*vec4(a_position, 1.);
  vColor=a_color;
}
</script>
<script id="fragment-shader" type="x-shader/x-fragment">
precision mediump float; 
varying vec3 vColor;
void main(void) {
  gl_FragColor = vec4(vColor, 1.);
}
</script>

<script type="text/javascript" src="webgl-utils.js"></script>
<script type="text/javascript" src="m4.js"></script>
<script type="text/javascript" src="persp_cubes_interact_webgl.js"></script>
</body>
</html>
