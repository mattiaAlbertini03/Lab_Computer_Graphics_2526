<!doctype html>
<html>
	<head>
		<style>
.canvas { border: thin inset #aaaaaa; }
		</style>
	</head>
	<body>
		<canvas width="400" height="400" id="my_Canvas" class="canvas"></canvas>
		<canvas width="400" height="400" id="my_Canvas2" class="canvas"></canvas>
		<canvas width="400" height="400" id="my_Canvas3" class="canvas"></canvas>
		<canvas width="400" height="400" id="my_Canvas4" class="canvas"></canvas>
		<script id="vertex-shader" type="x-shader/x-vertex">
			attribute vec3 a_position;
uniform mat4 Pmatrix; 
attribute vec2 a_texcoord;
uniform mat4 Vmatrix;
uniform mat4 Mmatrix;
attribute vec3 a_color;
varying vec3 vColor;
varying vec2 v_texcoord;
void main(void) {
  gl_Position = Pmatrix*Vmatrix*Mmatrix*vec4(a_position, 1.);
  v_texcoord = a_texcoord;
  vColor=a_color;
}
		</script>
		<script id="fragment-shader" type="x-shader/x-fragment">
			precision mediump float; 
varying vec3 vColor;
varying vec2 v_texcoord;
uniform sampler2D diffuseMap;
void main(void) {
gl_FragColor = vec4(texture2D(diffuseMap, v_texcoord))*vec4(vColor, 1.);
}
		</script>

		<script id="vertex-shader3" type="x-shader/x-vertex">
			attribute vec3 a_position;
uniform mat4 Pmatrix; 
attribute vec2 a_texcoord;
uniform mat4 Vmatrix;
uniform mat4 Mmatrix;
varying vec2 v_texcoord;
void main(void) {
  gl_Position = Pmatrix*Vmatrix*Mmatrix*vec4(a_position, 1.);
  v_texcoord = a_texcoord;
}
		</script>
		<script id="fragment-shader3" type="x-shader/x-fragment">
			precision mediump float; 
varying vec2 v_texcoord;
uniform sampler2D diffuseMap;
void main(void) {
gl_FragColor = vec4(texture2D(diffuseMap, v_texcoord));
}
		</script>
		<script id="vertex-shader4" type="x-shader/x-vertex">
			attribute vec3 a_position;
uniform mat4 Pmatrix; 
attribute vec2 a_texcoord;
uniform mat4 Vmatrix;
uniform mat4 Mmatrix;
attribute vec3 a_color;
varying vec3 vColor;
varying vec2 v_texcoord;
void main(void) {
  vec4 pos = Pmatrix*Vmatrix*Mmatrix*vec4(a_position, 1.);
  gl_Position = vec4(pos.xyz / pos.w, 1.0);
  v_texcoord = a_texcoord;
  vColor=a_color;
}
		</script>
		<script id="fragment-shader4" type="x-shader/x-fragment">
			precision mediump float; 
varying vec3 vColor;
varying vec2 v_texcoord;
uniform sampler2D diffuseMap;
void main(void) {
gl_FragColor = vec4(texture2D(diffuseMap, v_texcoord))*vec4(vColor, 1.);
}
		</script>

		<script type="text/javascript" src="webgl-utils.js"></script>
		<script type="text/javascript" src="m4.js"></script>
		<script type="module" src="cube_1.js"></script>
		<script type="module" src="cube_2.js"></script>
		<script type="module" src="cube_3.js"></script>
		<script type="module" src="cube_4.js"></script>
	</body>
</html>
