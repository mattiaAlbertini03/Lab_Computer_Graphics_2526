<!doctype html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
		<title>3D-WebApp</title>
		<style>
body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
canvas { width: 100vw; height: 100vh; display: block; }
		</style>
	</head>
	<body>
		<canvas id="canvas"></canvas>

		<script id="skybox-vertex-shader" type="x-shader/x-vertex">
			attribute vec4 a_position;
			varying vec4 v_position;
			void main() {
				v_position = a_position;
				gl_Position = vec4(a_position.xy, 1.0, 1.0); // Force skybox to far depth plane
			}
		</script>

		<script id="skybox-fragment-shader" type="x-shader/x-fragment">
			precision mediump float;
			uniform samplerCube u_skybox;
			uniform mat4 u_viewProjectionInverse;
			varying vec4 v_position;
			void main() {
				vec4 t = u_viewProjectionInverse * v_position;
				gl_FragColor = textureCube(u_skybox, normalize(t.xyz / t.w));
			}
		</script>
		<script id="floor-vertex-shader" type="x-shader/x-vertex">
			attribute vec3 a_position;
			attribute vec3 a_color;
			uniform mat4 Pmatrix;
			uniform mat4 Vmatrix; 
			varying vec3 vColor;
			void main(void) {
				gl_Position = Pmatrix * Vmatrix * vec4(a_position, 1.0);
				vColor = a_color;
			}
		</script>

		<script id="floor-fragment-shader" type="x-shader/x-fragment">
			precision mediump float; 
			varying vec3 vColor;
			void main(void) {
				gl_FragColor = vec4(vColor, 1.0);
			}
		</script>
		
		<script id="strange-cube-vertex-shader" type="not-javascript">
			attribute vec3 a_position;
			attribute vec3 a_color; //the color of the point 
			uniform mat4 Pmatrix; 
			uniform mat4 Vmatrix;
			uniform mat4 Mmatrix;
			varying vec3 vColor;
			void main(void) { //pre-built function
				gl_Position = Pmatrix*Vmatrix*Mmatrix*vec4(a_position, 1.);
				vColor=a_color;
			}
		</script>

		<script id="strange-cube-fragment-shader" type="not-javascript">
			precision mediump float; 
			varying vec3 vColor;
			void main(void) {
				gl_FragColor = vec4(vColor, 1.);
			}
		</script>

		<script type="text/javascript" src="resources/mesh_utils.js"></script>
		<script type="text/javascript" src="resources/glm_utils.js"></script>
		<script type="text/javascript" src="resources/webgl-utils.js"></script>
		<script type="text/javascript" src="resources/m4.js"></script>
		<script type="text/javascript" src="resources/dat.gui.js"></script>
		<script type="text/javascript" src="index.js"></script>
	</body>
</html>
