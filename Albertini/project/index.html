<!doctype html>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
		<title>3D-WebApp: project</title>
		<link type="text/css" href="index.css" rel="stylesheet" />
	</head>
	<body>
		<canvas id="canvas" ></canvas>
		<div id="joystick-zone" class="mobile">
			<div id="joystick-handle"></div>
		</div>

		<script id="skybox-vertex-shader" type="not-javascript">
			attribute vec4 a_position;
			varying vec4 v_position;
			void main() {
				v_position = a_position;
				gl_Position = vec4(a_position.xy, 1.0, 1.0); 
			}
		</script>

		<script id="skybox-fragment-shader" type="not-javascript">
			precision mediump float;
			uniform samplerCube u_skybox;
			uniform mat4 u_VPInverse;
			varying vec4 v_position;
			void main() {
				vec4 t = u_VPInverse * v_position;
				gl_FragColor = textureCube(u_skybox, normalize(t.xyz / t.w));
			}
		</script>
		<script id="mirror-vertex-shader" type="not-javascript">
			attribute vec3 a_position;
			attribute vec3 a_color;
			uniform mat4 Pmatrix;
			uniform mat4 Vmatrix; 
			varying vec3 vColor;
			void main(void) {
				gl_Position = Pmatrix * Vmatrix * vec4(a_position, 1.0);
				vColor = a_color;
			}
		</script>

		<script id="mirror-fragment-shader" type="not-javascript">
			precision mediump float; 
			varying vec3 vColor;
			void main(void) {
				gl_FragColor = vec4(vColor, 1.0);
			}
		</script>
		<script id="cubes-vertex-shader" type="not-javascript">
			attribute vec3 a_position;
			attribute vec2 a_texcoord;
			attribute vec3 a_normal; 

			uniform mat4 Pmatrix; 
			uniform mat4 Vmatrix;
			uniform mat4 Mmatrix;
			uniform int mode; 
			uniform vec3 camera;

			varying vec3 v_normal; 
			varying vec3 v_surfaceToView;
			varying vec2 v_texcoord;
			void main(void) {
				vec4 worldPosition = Mmatrix * vec4(a_position, 1.);
				gl_Position = Pmatrix * Vmatrix * worldPosition;

				if (mode == 1) gl_Position /= gl_Position.w;
				if (mode == 2) gl_Position *= gl_Position.w;
				if (mode == 3) gl_Position /= gl_Position.w;

				v_surfaceToView = camera - worldPosition.xyz;

				v_texcoord = a_texcoord;
				v_normal = mat3(Mmatrix) * a_normal;
			}
		</script>

		<script id="cubes-fragment-shader" type="not-javascript">
			precision mediump float; 

			uniform sampler2D diffuseMap;
			uniform vec3 u_lightDirection; 
			uniform vec3 u_ambientLight; 
			uniform vec3 u_colorLight;

			varying vec2 v_texcoord;
			varying vec3 v_normal;
			varying vec3 v_surfaceToView; 

			void main(void) {
				vec3 normal = normalize(v_normal);

				vec3 surfaceToViewDirection = normalize(v_surfaceToView); 
				vec3 halfVector = normalize(u_lightDirection + surfaceToViewDirection);

				float fakeLight = dot(u_lightDirection, normal) * 0.5 + 0.5;

				float specularLight = clamp(dot(normal, halfVector), 0.0, 1.0);

				vec4 texColor = texture2D(diffuseMap, v_texcoord);

				vec3 effectiveDiffuse = texColor.rgb * u_colorLight.rgb * fakeLight; 

				vec3 finalColor = (vec3(0.2, 0.2, 0.2) * u_ambientLight) + effectiveDiffuse  + pow(specularLight, 100.0);

				gl_FragColor = vec4(finalColor, texColor.a);
			}
		</script>



		<script id="obj-vertex-shader" type="not-javascript">
			attribute vec4 a_position;
			attribute vec3 a_normal;
			attribute vec2 a_texcoord;

			uniform mat4 Pmatrix;
			uniform mat4 Vmatrix;
			uniform mat4 Mmatrix;
			uniform vec3 camera;

			varying vec3 v_normal;
			varying vec3 v_surfaceToView;
			varying vec2 v_texcoord;

			void main() {
				vec4 worldPosition = Mmatrix * a_position;
				gl_Position = Pmatrix * Vmatrix * worldPosition;
				v_surfaceToView = camera - worldPosition.xyz;
				v_normal = mat3(Mmatrix) * a_normal;
				v_texcoord = a_texcoord;
			}
		</script>

		<script id="obj-fragment-shader" type="not-javascript">
			precision mediump float; 

			varying vec3 v_normal;
			varying vec3 v_surfaceToView;  
			varying vec2 v_texcoord;

			uniform sampler2D diffuseMap;
			uniform vec3 u_lightDirection;
			uniform vec3 u_ambientLight;
			uniform vec3 u_colorLight;

			uniform vec3 diffuse;
			uniform vec3 ambient;
			uniform vec3 emissive;
			uniform vec3 specular;
			uniform float shininess;
			uniform float opacity;

			void main () {
				vec3 normal = normalize(v_normal);
				vec3 surfaceToViewDirection = normalize(v_surfaceToView); 
				vec3 halfVector = normalize(u_lightDirection + surfaceToViewDirection);

				float fakeLight = dot(u_lightDirection, normal) * .5 + .5;
				float specularLight = clamp(dot(normal, halfVector), 0.0, 1.0);

				vec4 texColor = texture2D(diffuseMap, v_texcoord);

				vec3 effectiveDiffuse = diffuse * texColor.rgb * u_colorLight.rgb * fakeLight; 
				float effectiveOpacity = opacity * texColor.a; 

				vec3 finalColor = emissive + (ambient * u_ambientLight) + effectiveDiffuse  + (specular * pow(specularLight, shininess));
				gl_FragColor = vec4(finalColor, effectiveOpacity);
			}
		</script>

		<script type="text/javascript" src="mouse-keyboard.js"></script>
		<script type="text/javascript" src="touch.js"></script>

	</body>
