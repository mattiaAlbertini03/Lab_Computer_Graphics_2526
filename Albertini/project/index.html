	<body>
		<canvas id="canvas" ></canvas>
		<input type="range" class="mobile" id="zoom-slider" min="-45" max="-15" step="0.5" value="-30">
		<div id="joystick-zone" class="mobile">
			<div id="joystick-handle"></div>
		</div>

		<script id="skybox-vertex-shader" type="not-javascript">
			attribute vec4 a_position;
			varying vec4 v_position;
			void main() {
				v_position = a_position;
				gl_Position = vec4(a_position.xy, 1.0, 1.0); // Force skybox to far depth plane
			}
		</script>

		<script id="skybox-fragment-shader" type="not-javascript">
			precision mediump float;
			uniform samplerCube u_skybox;
			uniform mat4 u_viewProjectionInverse;
			varying vec4 v_position;
			void main() {
				vec4 t = u_viewProjectionInverse * v_position;
				gl_FragColor = textureCube(u_skybox, normalize(t.xyz / t.w));
			}
		</script>
		<script id="floor-vertex-shader" type="not-javascript">
			attribute vec3 a_position;
			attribute vec3 a_color;
			uniform mat4 Pmatrix;
			uniform mat4 Vmatrix; 
			varying vec3 vColor;
			void main(void) {
				gl_Position = Pmatrix * Vmatrix * vec4(a_position, 1.0);
				vColor = a_color;
			}
		</script>

		<script id="floor-fragment-shader" type="not-javascript">
			precision mediump float; 
			varying vec3 vColor;
			void main(void) {
				gl_FragColor = vec4(vColor, 1.0);
			}
		</script>

		<script id="strange-cube-vertex-shader" type="not-javascript">
			attribute vec3 a_position;
			uniform mat4 Pmatrix; 
			uniform mat4 Vmatrix;
			uniform mat4 Mmatrix;
			attribute vec2 a_texcoord;
			varying vec2 v_texcoord;
			uniform int mode; 
			void main(void) {
 				 vec4 pos = Pmatrix*Vmatrix*Mmatrix*vec4(a_position, 1.);
				gl_Position = pos;
				if (mode == 1) gl_Position /= gl_Position.w;
				if (mode == 2) gl_Position *= gl_Position.w;
				if (mode == 3) gl_Position /= gl_Position.w;
				
				v_texcoord = a_texcoord;
			}
		</script>

		<script id="strange-cube-fragment-shader" type="not-javascript">
			precision mediump float; 
			varying vec2 v_texcoord;
			uniform sampler2D diffuseMap;
			void main(void) {
				gl_FragColor = vec4(texture2D(diffuseMap, v_texcoord));
			}
		</script>
		

		
<script id="obj-vertex-shader" type="not-javascript">
  attribute vec4 a_position;
  attribute vec3 a_normal;
  attribute vec2 a_texcoord;

  uniform mat4 u_projection;
  uniform mat4 u_view;
  uniform mat4 u_world;
  uniform vec3 u_viewWorldPosition;

  varying vec3 v_normal;
  varying vec3 v_surfaceToView;
  varying vec2 v_texcoord;

  void main() {
    vec4 worldPosition = u_world * a_position;
    gl_Position = u_projection * u_view * worldPosition;
    v_surfaceToView = u_viewWorldPosition - worldPosition.xyz;
    v_normal = mat3(u_world) * a_normal;
    v_texcoord = a_texcoord;
  }
</script>

<script id="obj-fragment-shader" type="not-javascript">
  precision highp float;

  varying vec3 v_normal;
  varying vec3 v_surfaceToView;
  varying vec2 v_texcoord;

  uniform vec3 diffuse;
  uniform vec3 ambient;
  uniform vec3 emissive;
  uniform vec3 specular;
  uniform float shininess;
  uniform float opacity;
  uniform vec3 u_lightDirection;
  uniform vec3 u_ambientLight;
  uniform vec3 u_colorLight;
  uniform sampler2D diffuseMap;

  void main () {
    vec3 normal = normalize(v_normal);
    vec3 surfaceToViewDirection = normalize(v_surfaceToView);
    vec3 halfVector = normalize(u_lightDirection + surfaceToViewDirection);

    float fakeLight = dot(u_lightDirection, normal) * .5 + .5;
    float specularLight = clamp(dot(normal, halfVector), 0.0, 1.0);

    vec4 diffuseMapColor = texture2D(diffuseMap, v_texcoord);
    vec3 effectiveDiffuse = diffuse * diffuseMapColor.rgb * u_colorLight.rgb;
    float effectiveOpacity = opacity * diffuseMapColor.a;

    gl_FragColor = vec4(
        emissive +
        ambient * u_ambientLight +
        effectiveDiffuse * fakeLight +
        specular * pow(specularLight, shininess),
        effectiveOpacity);
  }
</script>
